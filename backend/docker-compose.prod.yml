services:
  db:
    image: postgres:15
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file:
      - .env.prod
    environment:
      - DJANGO_ENV=production
      - DB_HOST=db
    volumes:
      - app_static:/app/staticfiles
      - app_media:/app/documents
    command: >
      sh -c "uv run python manage.py migrate --noinput
      && uv run python manage.py collectstatic --noinput
      && uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      - db

  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - app_static:/app/staticfiles:ro
      - app_media:/app/documents:ro
    depends_on:
      - app

volumes:
  postgres_data:
  app_static:
  app_media:
version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  app:
    build: .
    restart: always
    env_file:
      - .env.prod
    environment:
      - DJANGO_ENV=production
      - DB_HOST=db
    command: >
      sh -c "uv run python manage.py migrate --noinput
      && uv run python manage.py collectstatic --noinput
      && uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      - db
    networks:
      - backend

  nginx:
    image: nginx:1.25
    restart: always
    depends_on:
      - app
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
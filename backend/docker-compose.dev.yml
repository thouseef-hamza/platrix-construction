services:
  db:
    image: postgres:15
    env_file:
      - .env.dev
    ports:
      - "5432:5432"

  app:
    build: .
    env_file:
      - .env.dev
    environment:
      - DB_HOST=db
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  nginx:
    profiles: ["disabled"]